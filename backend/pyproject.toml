[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tip-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.1,<3",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "xlwt>=1.3,<2"]

[tool.setuptools.packages.find]
include = ["tip*"]

[tool.setuptools.package-data]
tip = ["prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
